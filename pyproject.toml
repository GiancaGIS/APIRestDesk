[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-rest-desk"
authors = [
    { name = "GiancaGIS" }
]
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md", "SOURCE_CODE.md", "SOURCE_MANIFEST.toml", "licenses/**/*"]
version = "1.0.5"
description = "Desktop REST client built with PyQt6."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6==6.11.0",
    "PyQt6-Qt6==6.11.1",
    "PyQt6.sip==13.11.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
packaging = [
    "pyinstaller==6.21.0",
]

[project.scripts]
api-rest-desk = "api_rest_desk.__main__:main"

[tool.setuptools]
packages = ["api_rest_desk"]

[tool.setuptools.package-data]
api_rest_desk = ["assets/*", "legal/*", "legal/licenses/*", "legal/licenses/*/*"]
